<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <div class="container is-max-desktop">
      {{ partial "header.html" . }}
    </div>
    <div class="container p-2 is-max-desktop">
      <main class="content">
        {{ block "main" . }}{{ end }}
      </main>
    </div>
    <div class="container is-max-desktop">
      <footer class="footer">
        {{ partial "footer.html" . }}
      </footer>
    </div>
  </body>
</html>
